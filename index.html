<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Budget</title>

    <!-- Firebase SDK (Version 8.10.0) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <script>
        // Initialisation Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyC4ex3I0vm4Rcy-tvtE89P7I3S1eN8M4g",
            authDomain: "gestion-de-budget-3d84c.firebaseapp.com",
            projectId: "gestion-de-budget-3d84c",
            storageBucket: "gestion-de-budget-3d84c.appspot.com",
            messagingSenderId: "399717340978",
            appId: "1:399717340978:web:fb04c1eff550a56902c9ab"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
    </script>

    <style>
        :root {
            --primary: #057eff;
            --primary-hover: #0056b3;
            --danger: #dc3545;
            --bg-dark: #121212;
            --surface: #1e1e1e;
            --border: #444;
            --text-main: #e0e0e0;
            --text-muted: #aaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-container {
            background-color: var(--surface);
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: var(--primary);
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .toggle-link {
            margin-top: 15px;
            font-size: 13px;
            color: var(--primary);
            cursor: pointer;
            display: inline-block;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Formulaire Connexion -->
        <div id="login-form">
            <h2>Se connecter</h2>
            <div class="form-group">
                <label for="login-email">Identifiant ou Email</label>
                <input type="email" id="login-email" placeholder="nom@example.com" required>
            </div>
            <div class="form-group">
                <label for="login-password">Mot de passe</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <button class="btn" onclick="login()">Se connecter</button>
            <div>
                <span class="toggle-link" onclick="showSignup()">Pas encore de compte ? S'inscrire</span>
            </div>
        </div>

        <!-- Formulaire Inscription -->
        <div id="signup-form" class="hidden">
            <h2>S'inscrire</h2>
            <div class="form-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="nom@example.com" required>
            </div>
            <div class="form-group">
                <label for="signup-password">Mot de passe</label>
                <input type="password" id="signup-password" placeholder="••••••••" required>
            </div>
            <button class="btn" onclick="signup()">S'inscrire</button>
            <div>
                <span class="toggle-link" onclick="showLogin()">Déjà un compte ? Se connecter</span>
            </div>
        </div>
    </div>

    <script>
        function showSignup() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('signup-form').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('signup-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        }

        function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert("Connexion réussie !");
                })
                .catch((error) => {
                    alert("Erreur de connexion : " + error.message);
                });
        }

        function signup() {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert("Compte créé avec succès !");
                    showLogin();
                })
                .catch((error) => {
                    alert("Erreur d'inscription : " + error.message);
                });
        }
    </script>

</body>
</html>
